
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My English Vocabulary</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<header>
  <h1>📘 My English Vocabulary</h1>
</header>

<main>

  <input
    id="search"
    type="text"
    placeholder="単語を検索..."
  >

  <div id="card">
      <h2 id="word">Loading...</h2>

      <div id="answer" style="display:none">
          <h3 id="meaning"></h3>

          <p id="example"></p>

          <p id="translation"></p>
      </div>

      <button id="flipButton">
          タップして意味を見る
      </button>

  </div>

  <button id="nextButton">
      次の単語
  </button>
<button id="learnedButton">
✅ 覚えた
</button>

<div class="progress-container">
  <div id="progressBar"></div>
</div>

<p id="progressText"></p>

<button id="showUnlearned">
未習得のみ
</button>

<button id="showAll">
すべて表示
</button>
  
<button id="speakButton">
    🔊 発音
</button>
 <button id="favoriteButton">
⭐ お気に入り
</button>

<button id="weakButton">
❌ 苦手
</button> 
</main>

<script src="app.js"></script>


<button onclick="addWeakWord()">❗苦手登録</button>

<button onclick="startWeakListening()">
🎧 苦手単語リスニング
</button>
</body>
</html>
